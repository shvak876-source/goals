<title>מטרות היום</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one-column iOS-style screen; floating Liquid Glass dock (tab bar + round add button) over a soft color field */
:root {
  --bg: #f2f3f0;
  --bg-tint-1: #c9f2dc;
  --bg-tint-2: #cfe3ff;
  --bg-tint-3: #ffe3cc;
  --surface: rgba(255, 255, 255, 0.78);
  --surface-solid: #ffffff;
  --fg: #111613;
  --fg-2: #5d6661;
  --fg-3: #9aa29d;
  --line: rgba(17, 22, 19, 0.08);
  --accent: #17a85a;
  --accent-2: #8bdc3f;
  --accent-ink: #ffffff;
  --accent-soft: rgba(23, 168, 90, 0.12);
  --danger: #e5383b;
  --heat-0: rgba(17, 22, 19, 0.06);
  --heat-1: #c4ecd2;
  --heat-2: #86d7a5;
  --heat-3: #3fbd72;
  --heat-4: #138a48;
  --glass-fill: rgba(255, 255, 255, 0.42);
  --glass-edge: rgba(255, 255, 255, 0.85);
  --glass-edge-low: rgba(255, 255, 255, 0.25);
  --glass-shadow: 0 10px 30px rgba(20, 40, 30, 0.16), 0 2px 6px rgba(20, 40, 30, 0.08);
  --glass-pill: rgba(255, 255, 255, 0.7);
  --backdrop: rgba(10, 20, 15, 0.28);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Hebrew", "Arial Hebrew", "Segoe UI", system-ui, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Hebrew", "Arial Hebrew", "Segoe UI", system-ui, sans-serif;
  --r-card: 22px;
  --ease: cubic-bezier(0.32, 0.72, 0, 1);
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #050706;
    --bg-tint-1: #0e3b24;
    --bg-tint-2: #10264a;
    --bg-tint-3: #3a2410;
    --surface: rgba(28, 30, 29, 0.78);
    --surface-solid: #1c1e1d;
    --fg: #f3f6f4;
    --fg-2: #a3aca7;
    --fg-3: #67706b;
    --line: rgba(255, 255, 255, 0.08);
    --accent: #30d16f;
    --accent-2: #a6ef5a;
    --accent-ink: #04130a;
    --accent-soft: rgba(48, 209, 111, 0.16);
    --danger: #ff5a5f;
    --heat-0: rgba(255, 255, 255, 0.07);
    --heat-1: #12452a;
    --heat-2: #1a7040;
    --heat-3: #26a55c;
    --heat-4: #4fe58a;
    --glass-fill: rgba(40, 44, 42, 0.38);
    --glass-edge: rgba(255, 255, 255, 0.28);
    --glass-edge-low: rgba(255, 255, 255, 0.06);
    --glass-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.3);
    --glass-pill: rgba(255, 255, 255, 0.14);
    --backdrop: rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #050706;
  --bg-tint-1: #0e3b24;
  --bg-tint-2: #10264a;
  --bg-tint-3: #3a2410;
  --surface: rgba(28, 30, 29, 0.78);
  --surface-solid: #1c1e1d;
  --fg: #f3f6f4;
  --fg-2: #a3aca7;
  --fg-3: #67706b;
  --line: rgba(255, 255, 255, 0.08);
  --accent: #30d16f;
  --accent-2: #a6ef5a;
  --accent-ink: #04130a;
  --accent-soft: rgba(48, 209, 111, 0.16);
  --danger: #ff5a5f;
  --heat-0: rgba(255, 255, 255, 0.07);
  --heat-1: #12452a;
  --heat-2: #1a7040;
  --heat-3: #26a55c;
  --heat-4: #4fe58a;
  --glass-fill: rgba(40, 44, 42, 0.38);
  --glass-edge: rgba(255, 255, 255, 0.28);
  --glass-edge-low: rgba(255, 255, 255, 0.06);
  --glass-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.3);
  --glass-pill: rgba(255, 255, 255, 0.14);
  --backdrop: rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.35;
  -webkit-font-smoothing: antialiased;
  min-height: 100%;
  overscroll-behavior-y: none;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 10px; }

/* ambient color field so the glass has something to refract */
.field { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.field i { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.45; }
.field i:nth-child(1) { width: 70vw; height: 70vw; max-width: 520px; max-height: 520px; background: var(--bg-tint-1); top: -18vw; right: -20vw; }
.field i:nth-child(2) { width: 60vw; height: 60vw; max-width: 460px; max-height: 460px; background: var(--bg-tint-2); top: 38%; left: -25vw; }
.field i:nth-child(3) { width: 55vw; height: 55vw; max-width: 420px; max-height: 420px; background: var(--bg-tint-3); bottom: -20vw; right: -10vw; opacity: 0.6; }

.app {
  position: relative; z-index: 1;
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(120px + env(safe-area-inset-bottom, 0px));
}
.view { display: flex; flex-direction: column; gap: 18px; animation: viewIn 0.35s var(--ease); }
@keyframes viewIn { from { opacity: 0.4; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- Liquid Glass ---------- */
.glass {
  position: relative;
  isolation: isolate;
  background: var(--glass-fill);
  -webkit-backdrop-filter: blur(18px) saturate(190%) brightness(1.04);
  backdrop-filter: blur(18px) saturate(190%) brightness(1.04);
  box-shadow:
    var(--glass-shadow),
    inset 0 1px 0.5px var(--glass-edge),
    inset 0 -1px 0.5px var(--glass-edge-low),
    inset 1px 0 0.5px var(--glass-edge-low),
    inset -1px 0 0.5px var(--glass-edge-low);
}
/* specular rim: a thin gradient border that catches light at top-right and bottom-left */
.glass::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; z-index: -1;
  background: linear-gradient(135deg, var(--glass-edge) 0%, transparent 35%, transparent 65%, var(--glass-edge) 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  opacity: 0.9;
}
/* inner sheen */
.glass::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: -1;
  background: radial-gradient(120% 80% at 50% -10%, rgba(255,255,255,0.35), transparent 55%);
  mix-blend-mode: soft-light;
}

/* ---------- Header ---------- */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding-top: 22px; }
.top-text { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.date { font-size: 15px; font-weight: 600; color: var(--accent); }
.date span { color: var(--fg-3); font-weight: 500; }
h1 { font-family: var(--font-display); font-size: 34px; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.greet { text-align: start; border-radius: 10px; }
.status { display: flex; align-items: center; gap: 6px; color: var(--fg-2); font-size: 15px; font-weight: 500; margin-top: -6px; font-variant-numeric: tabular-nums; }
.status svg { width: 14px; height: 14px; color: var(--accent); }
.status .sep { color: var(--fg-3); }

/* ---------- Progress ring (small, in the header) ---------- */
.ring { position: relative; width: 62px; height: 62px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { stroke: var(--accent-soft); }
.ring .prog { stroke: url(#ringGrad); transition: stroke-dashoffset 0.8s var(--ease); }
.ring-label { position: absolute; inset: 0; display: grid; place-items: center; font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
.ring.celebrate { animation: pop 0.7s var(--spring); }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }

/* ---------- Goals list: one grouped surface, hairline separators ---------- */
.goals { list-style: none; margin: 4px 0 0; padding: 0; background: var(--surface); border-radius: var(--r-card); overflow: hidden; -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
.goal { position: relative; animation: rowIn 0.35s var(--ease) both; }
.goal + .goal::before { content: ""; position: absolute; top: 0; inset-inline-start: 58px; inset-inline-end: 0; height: 1px; background: var(--line); }
@keyframes rowIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.row { display: flex; align-items: center; gap: 6px; padding: 6px 8px 6px 10px; min-height: 58px; }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; text-align: start; padding: 8px 0; }
.row-title { font-size: 17px; font-weight: 500; overflow-wrap: anywhere; transition: color 0.3s; }
.row-meta { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--fg-3); font-weight: 500; }
.row-meta svg { width: 12px; height: 12px; }
.row-meta span + svg { margin-inline-start: 4px; }
.goal.done > .row .row-title, .sub.done .sub-title { color: var(--fg-3); text-decoration: line-through; text-decoration-color: var(--fg-3); }
.chev { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; color: var(--fg-3); flex: none; }
.chev svg { width: 17px; height: 17px; transition: transform 0.3s var(--ease); }
.goal.open .chev svg { transform: rotate(180deg); }

/* circular check */
.check { width: 28px; height: 28px; flex: none; border-radius: 50%; position: relative; display: grid; place-items: center; }
.check::before { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--fg-3); transition: border-color 0.2s, transform 0.3s var(--spring); }
.check::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: linear-gradient(145deg, var(--accent-2), var(--accent)); transform: scale(0); transition: transform 0.35s var(--spring); }
.check svg { position: relative; z-index: 1; width: 15px; height: 15px; stroke: var(--accent-ink); stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset 0.3s 0.1s var(--ease); }
.check.on::before { border-color: transparent; }
.check.on::after { transform: scale(1); }
.check.on svg { stroke-dashoffset: 0; }
.check:active::before { transform: scale(0.88); }
.check.sm { width: 22px; height: 22px; }
.check.sm svg { width: 12px; height: 12px; }
.check-hit { width: 44px; height: 44px; display: grid; place-items: center; flex: none; }

.subs { list-style: none; margin: 0; padding: 0 0 6px; display: none; }
.goal.open .subs { display: block; }
.sub { display: flex; align-items: center; gap: 6px; padding-inline: 44px 14px; min-height: 42px; }
.sub-title { flex: 1; min-width: 0; font-size: 16px; overflow-wrap: anywhere; color: var(--fg-2); }

.empty { text-align: center; padding: 48px 20px; color: var(--fg-2); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.empty svg { width: 44px; height: 44px; color: var(--fg-3); }
.empty strong { color: var(--fg); font-size: 17px; }
.hint { font-size: 13px; color: var(--fg-3); text-align: center; padding: 0 12px; margin: 0; }
.hint button { color: var(--accent); font-weight: 600; }
.danger-zone { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.btn.danger { color: var(--danger); background: var(--heat-0); width: 100%; flex: none; }

/* ---------- History ---------- */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--surface); border-radius: var(--r-card); padding: 16px; display: flex; flex-direction: column; gap: 4px; -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
.stat .num { font-family: var(--font-display); font-size: 34px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; display: flex; align-items: baseline; gap: 6px; }
.stat .num small { font-size: 15px; font-weight: 600; color: var(--fg-2); letter-spacing: 0; }
.stat .lbl { font-size: 14px; color: var(--fg-2); font-weight: 500; }
.stat.hero { grid-column: 1 / -1; background: linear-gradient(140deg, var(--accent-2), var(--accent)); color: var(--accent-ink); flex-direction: row; align-items: center; justify-content: space-between; }
.stat.hero .num { font-size: 52px; }
.stat.hero .num small, .stat.hero .lbl { color: var(--accent-ink); opacity: 0.85; }
.stat.hero svg { width: 64px; height: 64px; opacity: 0.9; flex: none; }

.card { background: var(--surface); border-radius: var(--r-card); padding: 16px; -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
.card h3 { margin: 0 0 12px; font-size: 17px; font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card h3 span { font-size: 13px; color: var(--fg-2); font-weight: 500; }
.heat-wrap { display: flex; gap: 6px; }
.heat-days { display: grid; grid-template-rows: repeat(7, 1fr); gap: 4px; font-size: 10px; color: var(--fg-3); font-weight: 600; padding-top: 18px; }
.heat-days span { display: flex; align-items: center; height: 100%; }
.heat-scroll { flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.heat-scroll::-webkit-scrollbar { display: none; }
.heat-months { display: grid; grid-auto-flow: column; grid-auto-columns: var(--cell); gap: 4px; height: 14px; margin-bottom: 4px; font-size: 10px; color: var(--fg-3); font-weight: 600; }
.heat-months span { white-space: nowrap; overflow: visible; }
.heat { --cell: 16px; display: grid; grid-template-rows: repeat(7, var(--cell)); grid-auto-flow: column; grid-auto-columns: var(--cell); gap: 4px; }
.cell { width: var(--cell); height: var(--cell); border-radius: 4px; background: var(--heat-0); }
.cell.l1 { background: var(--heat-1); } .cell.l2 { background: var(--heat-2); } .cell.l3 { background: var(--heat-3); } .cell.l4 { background: var(--heat-4); }
.cell.future { background: transparent; }
.cell.today { box-shadow: 0 0 0 1.5px var(--fg); }
button.cell:active { transform: scale(0.85); }
.legend { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 12px; font-size: 11px; color: var(--fg-2); }
.legend .cell { --cell: 12px; border-radius: 3px; }

.week { display: flex; flex-direction: column; gap: 10px; }
.wrow { display: grid; grid-template-columns: 74px 1fr 48px; align-items: center; gap: 10px; font-size: 14px; }
.wrow .wd { color: var(--fg-2); font-weight: 600; }
.wrow .bar { height: 8px; border-radius: 99px; background: var(--heat-0); overflow: hidden; }
.wrow .bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
.wrow .wv { text-align: end; font-variant-numeric: tabular-nums; color: var(--fg-2); font-weight: 600; }
.wrow.full .wv { color: var(--accent); }

/* ---------- Dock: floating glass tab bar + add button ---------- */
.dock {
  position: fixed; z-index: 20; left: 0; right: 0; bottom: 0;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: center; gap: 12px; pointer-events: none;
}
.dock > * { pointer-events: auto; }
.tabbar { display: flex; border-radius: 999px; padding: 4px; height: 64px; width: min(260px, 100%); }
.tab { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--fg-2); border-radius: 999px; transition: color 0.25s; }
.tab svg { width: 25px; height: 25px; }
.tab[aria-selected="true"] { color: var(--accent); }
.tab-pill { position: absolute; z-index: 0; top: 4px; bottom: 4px; width: calc(50% - 4px); border-radius: 999px; background: var(--glass-pill); box-shadow: inset 0 1px 0 var(--glass-edge), 0 1px 4px rgba(0,0,0,0.06); transition: transform 0.45s var(--spring), width 0.3s; right: 4px; }
.tabbar.on-1 .tab-pill { transform: translateX(-100%); }
.tabbar.squish .tab-pill { animation: squish 0.45s var(--ease); }
@keyframes squish { 40% { scale: 1.12 0.9; } }
.fab { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; color: var(--accent); flex: none; transition: transform 0.3s var(--spring); }
.fab svg { width: 28px; height: 28px; }
.fab:active, .tabbar:active { transform: scale(0.94); }
.tabbar { transition: transform 0.3s var(--spring); }

/* ---------- Sheets ---------- */
.backdrop { position: fixed; inset: 0; z-index: 40; background: var(--backdrop); opacity: 0; transition: opacity 0.3s; }
.backdrop.show { opacity: 1; }
.sheet {
  position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 560px;
  border-radius: 32px 32px 0 0;
  padding: 10px max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 20px) max(20px, env(safe-area-inset-left, 0px));
  transform: translateY(105%); transition: transform 0.45s var(--ease);
  max-height: 88vh; overflow-y: auto;
  --glass-fill: var(--surface);
}
.sheet.show { transform: none; }
.grabber { width: 38px; height: 5px; border-radius: 99px; background: var(--fg-3); opacity: 0.5; margin: 0 auto 14px; }
.sheet h2 { margin: 0 0 16px; font-size: 20px; font-weight: 800; text-align: center; }
.field-box { background: var(--heat-0); border-radius: 16px; padding: 0 14px; display: flex; align-items: center; gap: 8px; }
.field-box input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 14px 0; font-size: 17px; outline: none; }
.field-box input::placeholder { color: var(--fg-3); }
.field-box .x { color: var(--fg-3); width: 28px; height: 28px; display: grid; place-items: center; }
.field-box .x svg { width: 14px; height: 14px; }
.form { display: flex; flex-direction: column; gap: 10px; }
.label { font-size: 13px; font-weight: 600; color: var(--fg-2); padding: 8px 6px 0; }
.sub-inputs { display: flex; flex-direction: column; gap: 8px; }
.link-btn { align-self: flex-start; color: var(--accent); font-weight: 600; font-size: 15px; padding: 8px 6px; display: inline-flex; align-items: center; gap: 6px; }
.link-btn svg { width: 18px; height: 18px; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--heat-0); border-radius: 16px; padding: 12px 14px; }
.switch-row div { display: flex; flex-direction: column; }
.switch-row small { color: var(--fg-2); font-size: 13px; }
.switch { position: relative; width: 51px; height: 31px; flex: none; }
.switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 99px; background: var(--fg-3); opacity: 0.6; transition: background 0.25s, opacity 0.25s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 2px; right: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.2); transition: transform 0.3s var(--spring); }
.switch input:checked + span { background: var(--accent); opacity: 1; }
.switch input:checked + span::after { transform: translateX(-20px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.actions { display: flex; gap: 10px; margin-top: 8px; }
.btn { flex: 1; height: 52px; border-radius: 99px; font-weight: 700; font-size: 17px; background: var(--heat-0); }
.btn.primary { background: linear-gradient(140deg, var(--accent-2), var(--accent)); color: var(--accent-ink); }
.btn.primary:disabled { opacity: 0.4; }
.sheet .btn.cancel { margin-top: 10px; width: 100%; flex: none; }
.day-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.day-list li { display: flex; align-items: center; gap: 10px; padding: 8px 4px; font-size: 16px; }
.day-list li.subline { padding-inline-start: 34px; font-size: 15px; color: var(--fg-2); }
.day-list li.is-done span { color: var(--fg-3); text-decoration: line-through; }
.day-list .dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--fg-3); flex: none; display: grid; place-items: center; }
.day-list .is-done .dot { border: 0; background: var(--accent); color: var(--accent-ink); }
.day-list .dot svg { width: 11px; height: 11px; }
.day-sum { text-align: center; color: var(--fg-2); margin: -8px 0 14px; font-size: 15px; }

.toast { position: fixed; z-index: 30; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 14px); transform: translate(-50%, -150%); border-radius: 99px; padding: 12px 20px; font-weight: 700; font-size: 15px; white-space: nowrap; transition: transform 0.5s var(--spring); max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; }
.toast.show { transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--accent-2)"></stop>
      <stop offset="1" stop-color="var(--accent)"></stop>
    </linearGradient>
  </defs>
</svg>
<div class="field" aria-hidden="true"><i></i><i></i><i></i></div>

<main class="app" dir="rtl" lang="he">
  <section class="view" id="view-today">
    <header class="top">
      <div class="top-text">
        <div class="date" id="date"></div>
        <h1><button class="greet" id="greet" aria-label="שינוי שם"></button></h1>
      </div>
      <div class="ring" id="ring" role="img" aria-label="התקדמות היום">
        <svg viewBox="0 0 120 120" aria-hidden="true"><circle class="track" cx="60" cy="60" r="50" fill="none" stroke-width="16"></circle><circle class="prog" id="ring-prog" cx="60" cy="60" r="50" fill="none" stroke-width="16" stroke-linecap="round" stroke-dasharray="314.16" stroke-dashoffset="314.16"></circle></svg>
        <div class="ring-label" id="ring-pct">0%</div>
      </div>
    </header>
    <div class="status" id="status"></div>

    <ul class="goals" id="goals"></ul>
    <p class="hint" id="seed-hint" hidden>אלה מטרות לדוגמה · <button id="clear-seed">ניקוי</button></p>
  </section>

  <section class="view" id="view-history" hidden>
    <header class="top">
      <div class="top-text">
        <div class="date">ההתקדמות שלך</div>
        <h1>היסטוריה</h1>
      </div>
    </header>
    <div class="stats" id="stats"></div>
    <div class="card">
      <h3>ימים שהשלמתי <span id="heat-range"></span></h3>
      <div class="heat-wrap">
        <div class="heat-days" aria-hidden="true"><span>א׳</span><span></span><span>ג׳</span><span></span><span>ה׳</span><span></span><span>ש׳</span></div>
        <div class="heat-scroll" id="heat-scroll">
          <div class="heat-months" id="heat-months"></div>
          <div class="heat" id="heat"></div>
        </div>
      </div>
      <div class="legend"><span>פחות</span><i class="cell"></i><i class="cell l1"></i><i class="cell l2"></i><i class="cell l3"></i><i class="cell l4"></i><span>יותר</span></div>
    </div>
    <div class="card">
      <h3>7 הימים האחרונים</h3>
      <div class="week" id="week"></div>
    </div>
  </section>
</main>

<nav class="dock" dir="rtl" aria-label="ניווט">
  <div class="tabbar glass" id="tabbar" role="tablist">
    <div class="tab-pill" aria-hidden="true"></div>
    <button class="tab" role="tab" aria-selected="true" data-tab="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="m8 12.5 2.8 2.8L16.5 9.5"></path></svg>
      היום
    </button>
    <button class="tab" role="tab" aria-selected="false" data-tab="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="2"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="2"></rect><rect x="13.5" y="13.5" width="7" height="7" rx="2"></rect></svg>
      היסטוריה
    </button>
  </div>
  <button class="fab glass" id="fab" aria-label="מטרה חדשה">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
  </button>
</nav>

<div class="backdrop" id="backdrop" hidden></div>

<div class="sheet glass" id="sheet-add" dir="rtl" role="dialog" aria-modal="true" aria-labelledby="add-title" hidden>
  <div class="grabber"></div>
  <h2 id="add-title">מטרה חדשה</h2>
  <form class="form" id="add-form" autocomplete="off">
    <div class="field-box"><input id="goal-text" placeholder="מה המטרה?" maxlength="120" enterkeyhint="next"></div>
    <div class="label">תתי־מטרות</div>
    <div class="sub-inputs" id="sub-inputs"></div>
    <button type="button" class="link-btn" id="add-sub-input">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v8M8 12h8"></path></svg>
      הוספת תת־מטרה
    </button>
    <label class="switch-row" for="goal-repeat">
      <div><span>חוזרת כל יום</span><small>תופיע אוטומטית בכל בוקר</small></div>
      <span class="switch"><input type="checkbox" id="goal-repeat"><span></span></span>
    </label>
    <div class="actions">
      <button type="button" class="btn" id="add-cancel">ביטול</button>
      <button type="submit" class="btn primary" id="add-save">הוספה</button>
    </div>
    <div class="danger-zone" id="danger-zone" hidden>
      <button type="button" class="btn danger" id="del-today">מחיקה</button>
      <button type="button" class="btn danger" id="del-all" hidden>מחיקה והפסקת החזרה היומית</button>
    </div>
  </form>
</div>

<div class="sheet glass" id="sheet-day" dir="rtl" role="dialog" aria-modal="true" aria-labelledby="day-title" hidden>
  <div class="grabber"></div>
  <h2 id="day-title"></h2>
  <p class="day-sum" id="day-sum"></p>
  <ul class="day-list" id="day-list"></ul>
  <button class="btn cancel" data-close>סגירה</button>
</div>

<div class="sheet glass" id="sheet-settings" dir="rtl" role="dialog" aria-modal="true" aria-labelledby="set-title" hidden>
  <div class="grabber"></div>
  <h2 id="set-title">הגדרות</h2>
  <form class="form" id="set-form" autocomplete="off">
    <div class="label">איך לקרוא לך?</div>
    <div class="field-box"><input id="set-name" maxlength="30" placeholder="השם שלך"></div>
    <div class="actions">
      <button type="button" class="btn" data-close>ביטול</button>
      <button type="submit" class="btn primary">שמירה</button>
    </div>
  </form>
</div>

<div class="toast glass" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  document.documentElement.lang = 'he';
  document.documentElement.dir = 'rtl';

  const KEY = 'goals-app-v1';
  const $ = (s) => document.querySelector(s);
  const uid = () => Math.random().toString(36).slice(2, 10);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = (n) => String(n).padStart(2, '0');
  const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const dateOf = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };

  const ICON = {
    check: '<svg viewBox="0 0 24 24" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
    more: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
    repeat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></svg>',
    list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="m13.5 6.5 4 4"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>',
    flame: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c.5 3.5-1.6 5.3-3.2 7.1C7.4 10.7 6 12.4 6 15a6 6 0 0 0 12 0c0-2.4-1-4.3-2.3-5.8-.3 1.6-1.1 2.7-2.2 3.2.4-3.6-.4-7.6-1.5-10.4z"/></svg>',
    target: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>',
  };

  // ---------- state ----------
  function seed() {
    const t = keyOf(new Date());
    const mk = (text, subs = []) => ({ id: uid(), text, done: false, subs: subs.map((s) => ({ id: uid(), text: s, done: false })) });
    return {
      name: 'שלמה',
      seeded: true,
      templates: [],
      days: {
        [t]: { goals: [
          mk('לשתות 8 כוסות מים'),
          mk('אימון בוקר', ['חימום 5 דקות', 'ריצה 20 דקות', 'מתיחות']),
          mk('לקרוא 20 עמודים'),
        ] },
      },
    };
  }
  function load() {
    try { const raw = localStorage.getItem(KEY); if (raw) { const s = JSON.parse(raw); if (s && s.days) return s; } } catch (e) {}
    return seed();
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  let S = load();
  S.templates = S.templates || [];

  const todayKey = () => keyOf(new Date());
  function ensureDay(k) {
    if (!S.days[k]) {
      S.days[k] = { goals: S.templates.map((t) => ({ id: uid(), tid: t.id, text: t.text, done: false, subs: t.subs.map((s) => ({ id: uid(), text: s, done: false })) })) };
      save();
    }
    return S.days[k];
  }
  const goalDone = (g) => (g.subs.length ? g.subs.every((s) => s.done) : g.done);
  function dayStats(k) {
    const d = S.days[k];
    if (!d || !d.goals.length) return { total: 0, done: 0, ratio: 0, complete: false };
    const done = d.goals.filter(goalDone).length;
    return { total: d.goals.length, done, ratio: done / d.goals.length, complete: done === d.goals.length };
  }
  function streaks() {
    const today = new Date();
    let cur = 0;
    let d = dayStats(keyOf(today)).complete ? today : addDays(today, -1);
    while (dayStats(keyOf(d)).complete) { cur++; d = addDays(d, -1); }
    const keys = Object.keys(S.days).sort();
    let best = 0, run = 0, perfect = 0, goalsDone = 0;
    if (keys.length) {
      for (let x = dateOf(keys[0]); keyOf(x) <= keyOf(today); x = addDays(x, 1)) {
        const st = dayStats(keyOf(x));
        goalsDone += st.done;
        if (st.complete) { run++; perfect++; best = Math.max(best, run); } else run = 0;
      }
    }
    return { cur, best, perfect, goalsDone };
  }

  // ---------- formatting ----------
  const fmtDay = new Intl.DateTimeFormat('he-IL', { weekday: 'long', day: 'numeric', month: 'long' });
  let fmtHeb = null;
  try { fmtHeb = new Intl.DateTimeFormat('he-IL-u-ca-hebrew', { day: 'numeric', month: 'long', year: 'numeric' }); } catch (e) {}
  const fmtMonth = new Intl.DateTimeFormat('he-IL', { month: 'short' });
  const fmtShort = new Intl.DateTimeFormat('he-IL', { weekday: 'short', day: 'numeric' });
  function greeting(h) {
    if (h >= 5 && h < 12) return 'בוקר טוב';
    if (h >= 12 && h < 17) return 'צהריים טובים';
    if (h >= 17 && h < 22) return 'ערב טוב';
    return 'לילה טוב';
  }
  const plural = (n, one, many) => (n === 1 ? one : `${n} ${many}`);

  // ---------- today view ----------
  const collapsed = new Set();
  let lastComplete = null;
  function renderToday() {
    const now = new Date();
    const k = keyOf(now);
    const day = ensureDay(k);
    $('#date').innerHTML = `${esc(fmtDay.format(now))}${fmtHeb ? ` <span>· ${esc(fmtHeb.format(now))}</span>` : ''}`;
    $('#greet').textContent = S.name ? `${greeting(now.getHours())}, ${S.name}` : greeting(now.getHours());

    const st = dayStats(k);
    $('#ring-prog').style.strokeDashoffset = String(314.16 * (1 - st.ratio));
    $('#ring-pct').textContent = `${Math.round(st.ratio * 100)}%`;
    $('#ring').setAttribute('aria-label', `${st.done} מתוך ${st.total} מטרות הושלמו`);
    const s = streaks();
    const parts = [];
    parts.push(!st.total ? 'אין עדיין מטרות להיום' : st.complete ? 'השלמת הכול' : `${st.done} מתוך ${st.total} הושלמו`);
    if (s.cur > 0) parts.push(`${ICON.flame}<span>${s.cur === 1 ? 'יום אחד ברצף' : `${s.cur} ימים ברצף`}</span>`);
    $('#status').innerHTML = parts.map((p, i) => (i ? '<span class="sep">·</span>' : '') + (i ? p : `<span>${p}</span>`)).join('');

    if (lastComplete === false && st.complete) {
      const el = $('#ring'); el.classList.remove('celebrate'); void el.offsetWidth; el.classList.add('celebrate');
      toast('כל הכבוד! עמדת בכל המטרות להיום');
    }
    lastComplete = st.complete;

    const list = $('#goals');
    if (!day.goals.length) {
      list.innerHTML = `<li class="empty">${ICON.target}<strong>יום חדש, דף חלק</strong><span>לחץ על + כדי להוסיף מטרה</span></li>`;
    } else {
      list.innerHTML = day.goals.map((g) => {
        const done = goalDone(g);
        const subDone = g.subs.filter((x) => x.done).length;
        const open = g.subs.length > 0 && !collapsed.has(g.id);
        const meta = [];
        if (g.subs.length) meta.push(`${ICON.list}<span>${subDone}/${g.subs.length}</span>`);
        if (g.tid) meta.push(`${ICON.repeat}<span>כל יום</span>`);
        return `<li class="goal${done ? ' done' : ''}${open ? ' open' : ''}" data-id="${g.id}">
          <div class="row">
            <button class="check-hit" data-act="toggle" aria-label="${done ? 'ביטול סימון' : 'סימון כבוצע'}: ${esc(g.text)}" aria-pressed="${done}"><span class="check${done ? ' on' : ''}">${ICON.check}</span></button>
            <button class="row-main" data-act="edit" aria-label="עריכה: ${esc(g.text)}">
              <span class="row-title">${esc(g.text)}</span>
              ${meta.length ? `<span class="row-meta">${meta.join('')}</span>` : ''}
            </button>
            ${g.subs.length ? `<button class="chev" data-act="expand" aria-label="${open ? 'הסתרת תתי־מטרות' : 'הצגת תתי־מטרות'}" aria-expanded="${open}">${ICON.chev}</button>` : ''}
          </div>
          ${g.subs.length ? `<ul class="subs">
            ${g.subs.map((x) => `<li class="sub${x.done ? ' done' : ''}" data-sid="${x.id}">
              <button class="check-hit" data-act="toggle-sub" aria-label="${esc(x.text)}" aria-pressed="${x.done}"><span class="check sm${x.done ? ' on' : ''}">${ICON.check}</span></button>
              <span class="sub-title">${esc(x.text)}</span>
            </li>`).join('')}
          </ul>` : ''}
        </li>`;
      }).join('');
    }
    $('#seed-hint').hidden = !S.seeded;
  }

  function findGoal(id) { return ensureDay(todayKey()).goals.find((g) => g.id === id); }
  function syncTemplate(g) {
    if (!g.tid) return;
    const t = S.templates.find((x) => x.id === g.tid);
    if (t) { t.text = g.text; t.subs = g.subs.map((s) => s.text); }
  }

  $('#goals').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const li = btn.closest('.goal'); if (!li) return;
    const g = findGoal(li.dataset.id); if (!g) return;
    const act = btn.dataset.act;
    if (act === 'toggle') {
      const v = !goalDone(g);
      g.done = v; g.subs.forEach((s) => { s.done = v; });
    } else if (act === 'toggle-sub') {
      const s = g.subs.find((x) => x.id === btn.closest('.sub').dataset.sid);
      s.done = !s.done; g.done = goalDone(g);
    } else if (act === 'expand') {
      collapsed.has(g.id) ? collapsed.delete(g.id) : collapsed.add(g.id);
      li.classList.toggle('open');
      btn.setAttribute('aria-expanded', String(li.classList.contains('open')));
      return;
    } else if (act === 'edit') {
      openAdd(g); return;
    }
    save(); renderToday();
  });
  $('#clear-seed').addEventListener('click', () => {
    ensureDay(todayKey()).goals = []; S.seeded = false; save(); renderToday();
  });

  // ---------- sheets ----------
  let openSheet = null;
  function showSheet(el) {
    if (openSheet) hideSheet(true);
    const bd = $('#backdrop');
    bd.hidden = false; el.hidden = false;
    requestAnimationFrame(() => { bd.classList.add('show'); el.classList.add('show'); });
    openSheet = el;
  }
  function hideSheet(instant) {
    const el = openSheet; if (!el) return;
    const bd = $('#backdrop');
    el.classList.remove('show'); bd.classList.remove('show');
    openSheet = null;
    const done = () => { if (openSheet !== el) el.hidden = true; if (!openSheet) bd.hidden = true; };
    instant ? done() : setTimeout(done, 380);
  }
  $('#backdrop').addEventListener('click', () => hideSheet());
  document.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => hideSheet()));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideSheet(); });

  // add / edit sheet
  let editing = null;
  function subInput(val = '') {
    const box = document.createElement('div');
    box.className = 'field-box';
    box.innerHTML = `<input placeholder="תת־מטרה" maxlength="100" enterkeyhint="next" aria-label="תת־מטרה"><button type="button" class="x" aria-label="הסרה">${ICON.x}</button>`;
    box.querySelector('input').value = val;
    box.querySelector('.x').addEventListener('click', () => box.remove());
    $('#sub-inputs').appendChild(box);
    return box.querySelector('input');
  }
  function openAdd(g) {
    editing = g || null;
    $('#add-title').textContent = g ? 'עריכת מטרה' : 'מטרה חדשה';
    $('#add-save').textContent = g ? 'שמירה' : 'הוספה';
    $('#goal-text').value = g ? g.text : '';
    $('#goal-repeat').checked = g ? !!g.tid : false;
    $('#sub-inputs').innerHTML = '';
    if (g) g.subs.forEach((s) => subInput(s.text));
    $('#danger-zone').hidden = !g;
    $('#del-today').textContent = g && g.tid ? 'מחיקה מהיום בלבד' : 'מחיקת המטרה';
    $('#del-all').hidden = !(g && g.tid);
    showSheet($('#sheet-add'));
    if (!g) setTimeout(() => $('#goal-text').focus(), 60);
  }
  $('#fab').addEventListener('click', () => openAdd());
  $('#add-cancel').addEventListener('click', () => hideSheet());
  $('#add-sub-input').addEventListener('click', () => subInput().focus());
  $('#add-form').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.id !== 'goal-repeat') {
      e.preventDefault();
      if (e.target.id === 'goal-text') { $('#add-form').requestSubmit(); return; }
      if (e.target.value.trim()) subInput().focus();
    }
  });
  $('#add-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const text = $('#goal-text').value.trim();
    if (!text) { $('#goal-text').focus(); return; }
    const subTexts = [...$('#sub-inputs').querySelectorAll('input')].map((i) => i.value.trim()).filter(Boolean);
    const repeat = $('#goal-repeat').checked;
    const day = ensureDay(todayKey());
    if (editing) {
      const g = editing;
      g.text = text;
      g.subs = subTexts.map((t) => g.subs.find((s) => s.text === t) || { id: uid(), text: t, done: false });
      g.done = g.subs.length ? goalDone(g) : g.done;
      setRepeat(g, repeat);
      syncTemplate(g);
    } else {
      const g = { id: uid(), text, done: false, subs: subTexts.map((t) => ({ id: uid(), text: t, done: false })) };
      day.goals.push(g);
      setRepeat(g, repeat);
      if (S.seeded) S.seeded = false;
    }
    save(); hideSheet(); renderToday();
  });
  function setRepeat(g, on) {
    if (on && !g.tid) {
      const t = { id: uid(), text: g.text, subs: g.subs.map((s) => s.text) };
      S.templates.push(t); g.tid = t.id;
    } else if (!on && g.tid) {
      S.templates = S.templates.filter((t) => t.id !== g.tid); delete g.tid;
    }
  }

  // delete from the edit sheet
  function deleteEditing(stopRepeat) {
    const g = editing; if (!g) return;
    const day = ensureDay(todayKey());
    if (stopRepeat) setRepeat(g, false);
    day.goals = day.goals.filter((x) => x.id !== g.id);
    if (!day.goals.length) S.seeded = false;
    save(); hideSheet(); renderToday();
  }
  $('#del-today').addEventListener('click', () => deleteEditing(false));
  $('#del-all').addEventListener('click', () => deleteEditing(true));

  // settings
  $('#greet').addEventListener('click', () => { $('#set-name').value = S.name || ''; showSheet($('#sheet-settings')); });
  $('#set-form').addEventListener('submit', (e) => { e.preventDefault(); S.name = $('#set-name').value.trim(); save(); hideSheet(); renderToday(); });

  // ---------- history ----------
  function renderHistory() {
    const s = streaks();
    $('#stats').innerHTML = `
      <div class="stat hero"><div><div class="num">${s.cur}<small>${s.cur === 1 ? 'יום' : 'ימים'}</small></div><div class="lbl">ברצף שאני עומד במטרות</div></div>${ICON.flame}</div>
      <div class="stat"><div class="num">${s.best}<small>ימים</small></div><div class="lbl">שיא רצף</div></div>
      <div class="stat"><div class="num">${s.perfect}</div><div class="lbl">ימים מושלמים</div></div>
      <div class="stat" style="grid-column:1/-1"><div class="num">${s.goalsDone}</div><div class="lbl">מטרות שהושלמו בסך הכול</div></div>`;

    // heatmap: 20 weeks, Sunday-first rows, oldest column on the right (RTL)
    const WEEKS = 20;
    const today = new Date(); const tk = keyOf(today);
    const start = addDays(today, -today.getDay() - (WEEKS - 1) * 7);
    let cells = '', months = '', lastMonth = -1;
    for (let w = 0; w < WEEKS; w++) {
      const first = addDays(start, w * 7);
      const m = first.getMonth();
      months += `<span>${m !== lastMonth ? fmtMonth.format(first) : ''}</span>`;
      lastMonth = m;
      for (let d = 0; d < 7; d++) {
        const day = addDays(start, w * 7 + d); const k = keyOf(day);
        if (k > tk) { cells += '<i class="cell future"></i>'; continue; }
        const st = dayStats(k);
        const lvl = !st.total || !st.done ? 0 : st.complete ? 4 : st.ratio >= 0.66 ? 3 : st.ratio >= 0.33 ? 2 : 1;
        cells += `<button class="cell${lvl ? ' l' + lvl : ''}${k === tk ? ' today' : ''}" data-k="${k}" aria-label="${fmtDay.format(day)}: ${st.done} מתוך ${st.total}"></button>`;
      }
    }
    $('#heat').innerHTML = cells;
    $('#heat-months').innerHTML = months;
    $('#heat-range').textContent = `${WEEKS} שבועות`;
    const sc = $('#heat-scroll'); sc.scrollLeft = -sc.scrollWidth; // newest (left in RTL) into view

    let wk = '';
    for (let i = 0; i < 7; i++) {
      const day = addDays(today, -i); const st = dayStats(keyOf(day));
      wk += `<div class="wrow${st.complete ? ' full' : ''}"><span class="wd">${i === 0 ? 'היום' : i === 1 ? 'אתמול' : fmtShort.format(day)}</span><span class="bar"><i style="width:${Math.round(st.ratio * 100)}%"></i></span><span class="wv">${st.total ? `${st.done}/${st.total}` : '—'}</span></div>`;
    }
    $('#week').innerHTML = wk;
  }
  $('#heat').addEventListener('click', (e) => {
    const c = e.target.closest('[data-k]'); if (!c) return;
    const k = c.dataset.k; const day = S.days[k]; const st = dayStats(k);
    $('#day-title').textContent = fmtDay.format(dateOf(k));
    $('#day-sum').textContent = st.total ? (st.complete ? `השלמת את כל ${st.total} המטרות` : `${st.done} מתוך ${st.total} מטרות הושלמו`) : 'לא נרשמו מטרות ביום הזה';
    const dot = (on) => `<span class="dot">${on ? ICON.check.replace('fill="none"', 'fill="none" stroke="currentColor"') : ''}</span>`;
    $('#day-list').innerHTML = !day ? '' : day.goals.map((g) => `<li class="${goalDone(g) ? 'is-done' : ''}">${dot(goalDone(g))}<span>${esc(g.text)}</span></li>` +
      g.subs.map((s) => `<li class="subline ${s.done ? 'is-done' : ''}">${dot(s.done)}<span>${esc(s.text)}</span></li>`).join('')).join('');
    showSheet($('#sheet-day'));
  });

  // ---------- tabs ----------
  let tab = 'today';
  function setTab(t) {
    tab = t;
    const bar = $('#tabbar');
    bar.classList.toggle('on-1', t === 'history');
    bar.classList.remove('squish'); void bar.offsetWidth; bar.classList.add('squish');
    document.querySelectorAll('.tab').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
    $('#view-today').hidden = t !== 'today';
    $('#view-history').hidden = t !== 'history';
    $('#fab').hidden = false;
    t === 'today' ? renderToday() : renderHistory();
    window.scrollTo({ top: 0 });
  }
  document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => setTab(b.dataset.tab)));

  // ---------- toast ----------
  let toastT;
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600);
  }

  // ---------- day rollover ----------
  let shownKey = todayKey();
  function tick() {
    if (todayKey() !== shownKey) { shownKey = todayKey(); lastComplete = null; }
    tab === 'today' ? renderToday() : renderHistory();
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
  setInterval(() => { if (!openSheet && !document.activeElement?.matches('input')) tick(); }, 60000);

  save();
  renderToday();

  if ('serviceWorker' in navigator && window.isSecureContext && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
